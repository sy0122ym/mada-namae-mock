<style>
:root{--green:#0B3D2E;--green2:#12503B;--bg:#FAF7F1;--card:#FFFFFF;--ink:#23271F;--mut:#757A6E;--line:#E5DFD0;--line2:#EFEAE0;--red:#B3402A;--gold:#A8862A;--goldbg:#FBF4DC;--blue:#33608C;--serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;--sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
header{background:var(--bg);padding:20px 16px 0;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--ink)}
.hwrap{max-width:880px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:12px;border-bottom:3px double var(--ink)}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--line)}
h1{font-family:var(--serif);font-weight:800;font-size:21px;margin:0;letter-spacing:.06em;color:var(--green)}
.sub{font-size:10.5px;color:var(--mut);margin-top:3px;letter-spacing:.14em}
.hdate{text-align:right;font-family:var(--serif);font-size:14px;line-height:1.6;color:var(--ink)}
.hdate .upd{font-family:var(--sans);font-size:10.5px;color:var(--mut);letter-spacing:.05em}
.tabs{max-width:880px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;color:var(--mut);padding:11px 13px 9px;font-size:13.5px;white-space:nowrap;cursor:pointer;font-family:var(--sans);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--green);font-weight:700;border-bottom:2px solid var(--green)}
main{max-width:880px;margin:0 auto;padding:18px 16px 44px}
.mocknote{background:var(--goldbg);border:1px solid #E7D48F;color:#6D5B12;border-radius:10px;padding:9px 13px;font-size:12px;margin-bottom:14px;line-height:1.6}
h2.sec{font-family:var(--serif);font-weight:800;font-size:17px;margin:24px 0 12px;display:flex;align-items:center;gap:10px;color:var(--green);letter-spacing:.04em}
h2.sec:before{content:"";width:22px;height:1px;background:var(--gold);display:inline-block}
h2.sec:first-child{margin-top:4px}
.note{font-size:12.5px;color:var(--mut);line-height:1.8;margin:0 0 12px}
.feed{background:#fff;border-top:1px solid #E7E4DA;border-bottom:1px solid #E7E4DA;margin:0 -16px 12px}
.xcard{display:flex;gap:11px;background:#fff;padding:13px 16px;border-bottom:1px solid #EFF0EA}
.feed .xcard:last-child{border-bottom:0}
.xcard.top{box-shadow:inset 3px 0 0 var(--red)}
.xava{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;font-family:var(--serif);font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;font-size:17px}
.xbody{flex:1;min-width:0}
.xhead{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.xname{font-weight:700;font-size:14px}
.xmeta{color:#536471;font-size:12.5px}
.xtext{font-size:15px;line-height:1.6;margin:3px 0 10px;white-space:pre-wrap;word-break:break-word;color:#0F1419}
.xfoot{display:flex;gap:6px;color:#536471;font-size:12.5px;align-items:center;justify-content:space-between;max-width:430px}
.xact{display:inline-flex;align-items:center;gap:5px;color:#536471}
.xact svg{display:block}
.xfoot .link{margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(35,39,31,.05)}
.card.top{border-left:4px solid var(--red)}
.meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--mut);margin-bottom:6px;flex-wrap:wrap;letter-spacing:.03em}
.tag{font-weight:700;padding:2px 8px;border-radius:999px;background:#EDF1EA;color:var(--green);border:1px solid #D8DFD2}
.tag.hot{background:#FAE9E4;color:var(--red);border-color:#EFC9BE}
.tag.watch{background:var(--goldbg);color:#8A6D1F;border-color:#E7D48F}
.title{font-size:15.5px;font-weight:700;line-height:1.55;margin:0 0 5px}
.sum{font-size:13.5px;color:#3E443B;line-height:1.75;margin:0}
.text{white-space:pre-wrap;word-break:break-word}
.link{font-size:12px;color:var(--blue);text-decoration:none}
.chan{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 3px rgba(35,39,31,.05)}
.chanhead{background:#F3EFE3;padding:11px 16px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;color:var(--green)}
summary.chanhead{cursor:pointer;list-style:none;-webkit-tap-highlight-color:transparent}
summary.chanhead::-webkit-details-marker{display:none}
.chanright{display:inline-flex;align-items:center;gap:8px}
.chev{color:var(--mut);font-size:15px;transition:transform .15s}
details[open ] .chev{transform:rotate(90deg)}
.count{background:var(--green);color:#fff;border-radius:999px;font-size:11px;padding:1px 9px}
.sitem{padding:12px 16px;border-top:1px solid var(--line2)}
.sitem .meta{margin-bottom:3px}
.sitem .text{font-size:13.5px;line-height:1.7;margin:0}
details.sitem{padding:0}
details.sitem summary{cursor:pointer;list-style:none;padding:12px 16px;-webkit-tap-highlight-color:transparent}
details.sitem summary::-webkit-details-marker{display:none}
.srow{display:flex;gap:8px;align-items:baseline;font-size:13.5px}
.srow .time{color:var(--mut);font-size:11px;flex:none}
.srow .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .chev{flex:none}
details.sitem[open ] .chev{transform:rotate(90deg)}
details.sitem.hot summary{background:#FBF0EC;border-left:4px solid var(--red)}
.sfull{padding:0 16px 14px}
.hl{border-left:4px solid var(--red)}
.sumbar{display:flex;justify-content:space-between;align-items:baseline;background:var(--green);color:#fff;border-radius:16px;padding:15px 18px;margin:6px 0 12px;box-shadow:0 2px 8px rgba(11,61,46,.18)}
.sumdate{font-family:var(--serif);font-size:18px;font-weight:800;letter-spacing:.05em}
.sumtotal{font-size:12.5px;color:#C9D8CE}
.slacktabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.stab{border:1px solid #CFC9B8;background:#fff;border-radius:999px;padding:7px 13px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.stab.on{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
.stabn{background:#F0EBDD;border-radius:999px;padding:0 6px;font-size:11px;color:var(--green)}
.tab{transition:color .2s,border-color .2s,transform .12s}
.tab:active{transform:scale(.96)}
.stab{transition:background .2s,color .2s,border-color .2s,transform .12s}
.stab:active{transform:scale(.96)}
.btn,.iconbtn{transition:transform .12s,background .2s,opacity .2s}
.btn:active,.iconbtn:active{transform:scale(.97)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
main.enter>*{animation:viewIn .32s cubic-bezier(.2,.7,.25,1) both}
main.enter>*:nth-child(2){animation-delay:.04s}
main.enter>*:nth-child(3){animation-delay:.08s}
main.enter>*:nth-child(4){animation-delay:.12s}
main.enter>*:nth-child(5){animation-delay:.16s}
main.enter>*:nth-child(n+6){animation-delay:.2s}
.panelin{animation:viewIn .28s cubic-bezier(.2,.7,.25,1) both}
@media (prefers-reduced-motion: reduce){main.enter>*{animation:none}.panelin{animation:none}}
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:none;z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.btab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 3px;font-size:10px;color:var(--mut);cursor:pointer;font-family:var(--sans);transition:color .2s,transform .12s}
.btab svg{width:22px;height:22px}
.btab.on{color:var(--green);font-weight:700}
.btab:active{transform:scale(.94)}
.morerow{display:flex;justify-content:space-between;align-items:center;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:10px;font-size:14.5px;cursor:pointer;color:var(--ink);font-family:var(--sans)}
.morerow:active{transform:scale(.99)}
@media (max-width:768px){
  .sub{white-space:nowrap;font-size:9.5px;letter-spacing:.05em}
  .hdate{white-space:nowrap;font-size:12.5px}
  .hdate .upd{font-size:9.5px}
  h1{font-size:19px}
  .logo{width:40px;height:40px}
  .brand{min-width:0}
  .tabs{display:none}
  main{padding-bottom:96px}
  .bottomnav{display:flex}
}
.stab.on .stabn{background:rgba(255,255,255,.25);color:#fff}
.favbtn{background:none;border:1px solid var(--line);border-radius:999px;font-size:13px;cursor:pointer;padding:1px 8px;line-height:1.5;filter:grayscale(1);opacity:.45}
.favbtn.on{filter:none;opacity:1;border-color:#E3B34C;background:#FFF8E6}
.ximg{width:100%;aspect-ratio:16/9;object-fit:cover;max-height:240px;border-radius:16px;margin:2px 0 10px;border:1px solid #E7E4DA;display:block}
.memo{background:#FFF8E6;border-radius:8px;padding:6px 9px;font-size:12px;margin:0 0 8px;white-space:pre-wrap;word-break:break-word}
.badge{display:inline-block;background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:0 6px;margin-left:4px;vertical-align:2px}
.newtag{color:var(--red);font-weight:700;font-size:11px}
.seenline{text-align:center;color:var(--mut);font-size:11px;padding:10px 0 4px;letter-spacing:.1em}
.searchrow{margin-bottom:12px}
.searchrow input{width:100%;padding:11px 15px;border:1px solid var(--line);border-radius:999px;font-size:14px;background:#fff;color:var(--ink);outline:none}
.searchrow input:focus{border-color:var(--green)}
.sortrow{display:flex;gap:6px;margin-bottom:10px}
.compname{font-weight:700;font-size:15.5px}
#splash{position:fixed;inset:0;background:var(--green);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:60;transition:opacity .6s ease;padding:24px}
#splash.hide{opacity:0;pointer-events:none}
#splash img{width:92px;height:92px;border-radius:50%;border:2px solid rgba(255,255,255,.35);box-shadow:0 10px 30px rgba(0,0,0,.3)}
#splash-msg{font-family:var(--serif);font-size:18px;font-weight:600;text-align:center;line-height:2;margin:0;letter-spacing:.05em}
.splash-sub{font-size:12px;opacity:.75;margin:0;letter-spacing:.22em}
.splash-tap{font-size:11px;opacity:.5;margin:0}
.briefcard{background:#FDFBF4;border:1px solid var(--gold);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(168,134,42,.12)}
.brieftitle{font-family:var(--serif);font-weight:800;color:var(--green);margin:0 0 8px;font-size:15px;letter-spacing:.04em}
.briefpoints{margin:0 0 10px;padding-left:18px;font-size:14px;line-height:1.8}
.briefmove{font-size:13px;margin:0 0 5px;line-height:1.7}
.briefinsight{background:#fff;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0 0;line-height:1.75}
.mockframe{max-width:360px;margin:0 auto;background:#fff;border:2px solid #333;border-radius:22px;overflow:hidden}
.wf-head{background:var(--green);color:#fff;font-weight:bold;font-size:13px;padding:10px 12px}
.wf-body{padding:12px;display:flex;flex-direction:column;gap:10px}
.wf-bar{height:12px;border-radius:6px;background:#E3E8E3}
.wf-bar.w60{width:60%}.wf-bar.w40{width:40%}.wf-bar.w80{width:80%}
.wf-input{border:1.5px solid #9AA79D;border-radius:8px;padding:8px 10px;font-size:12px;color:var(--mut);background:#FAFBFA}
.wf-row{display:flex;align-items:center;gap:8px}
.wf-row .grow{flex:1}
.wf-btn{background:var(--green);color:#fff;text-align:center;border-radius:8px;padding:9px;font-size:13px;font-weight:bold}
.wf-btn.sub{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.wf-chip{border:1.5px solid #9AA79D;border-radius:999px;padding:3px 10px;font-size:11px;color:#445}
.wf-chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.wf-toggle{width:36px;height:20px;border-radius:999px;background:#C9D2C9;position:relative;flex:none}
.wf-toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.wf-toggle.on{background:var(--green)}
.wf-toggle.on::after{left:18px}
.wf-check{width:16px;height:16px;border:1.5px solid #9AA79D;border-radius:4px;flex:none}
.wf-check.on{background:var(--green);border-color:var(--green)}
.wf-label{font-size:12px;font-weight:bold}
.starbtn{background:none;border:0;font-size:16px;color:#C4BCA6;cursor:pointer;padding:0 2px;line-height:1}
.starbtn.on{color:#DFA92E}
.morebtn{display:block;width:100%;padding:12px;background:#fff;border:0;border-top:1px solid var(--line2);color:var(--green);font-size:13px;font-weight:700;cursor:pointer}
.thread{font-size:11px;color:var(--mut)}
.setbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(35,39,31,.05)}
.setbox h3{font-family:var(--serif);margin:0 0 12px;font-size:15px;color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.chip{background:#F0EBDD;border-radius:999px;padding:4px 8px 4px 12px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.chip button{border:0;background:none;color:#8a948d;cursor:pointer;font-size:13px;padding:0}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;padding:10px;border:1px solid #CFC9B8;border-radius:10px;font-size:14px;background:#fff}
.btn{background:var(--green);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer}
.btn.sub2{background:#fff;color:var(--green);border:1px solid var(--green)}
.btn.sm{padding:6px 13px;font-size:12.5px;font-weight:600}
.btnrow{display:flex;gap:6px;margin-top:8px}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.iconrow{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.iconbtn{display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 0 6px;width:60px;cursor:pointer;color:var(--green);font-size:9.5px;font-family:var(--sans);line-height:1}
.iconbtn svg{width:19px;height:19px}
.iconbtn:active{background:#F0EBDD}
.iconbtn.gen{border-color:#E3B34C;background:#FFF8E6;color:#8A6D1F}
.iconbtn.pending{color:#8A6D1F;border-color:#E7D48F;background:var(--goldbg);cursor:default}
.check{display:flex;align-items:center;gap:8px;font-size:14px;padding:5px 0}
.savebar{position:sticky;bottom:12px;text-align:right}
.empty{color:var(--mut);font-size:13px;padding:14px 0}
.datebar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.datebar input{padding:9px;border:1px solid #CFC9B8;border-radius:10px;font-size:14px;background:#fff}
footer{color:var(--mut);font-size:11px;text-align:center;padding:0 16px 30px;letter-spacing:.08em}
</style>
</head>

    var pr = {};
    [['risk','set-prio-risk'],['mention','set-prio-mention'],['stamp','set-prio-stamp'],['deadline','set-prio-deadline'],['perThread','set-prio-perthread'],['perHour','set-prio-perhour']].forEach(function(pair){ var el = document.getElementById(pair[1]); if (el) pr[pair[0]] = Math.max(0, Number(el.value) || 0); });
    if (Object.keys(pr).length) state.settings.priority = pr;
    var ln = document.getElementById('set-learn');

function sendReply(u, text){

document.getElementById('main').addEventListener('click', function(e){
  var mt = e.target.closest('[data-tab]');
  if (mt) { state.tab = mt.getAttribute('data-tab'); if (state.tab !== 'companies') state.companySel = null; render(); return; }
  var btn = e.target.closest('[data-star]');
  if (btn) { toggleStar(btn.getAttribute('data-star')); return; }

  if (fb) { toggleFav(fb.getAttribute('data-fav')); return; }

  if (ro) {
    var oid = ro.getAttribute('data-reply-open');
    state.replyOpen = state.replyOpen === oid ? null : oid;
    if (state.replyOpen !== oid) state.editReply = null;
    render();
    return;
  }
  var rs = e.target.closest('[data-reply-send]');
  if (rs) {
    var u1 = state.unreplied.find(function(x){ return x.id === rs.getAttribute('data-reply-send'); });
    if (u1) sendReply(u1, Number(rs.getAttribute('data-reply-idx')) === 1 ? u1.suggestion2 : u1.suggestion1);
    return;
  }
  var re = e.target.closest('[data-reply-edit]');
  if (re) {
    var u2 = state.unreplied.find(function(x){ return x.id === re.getAttribute('data-reply-edit'); });
    if (u2) { var ix = Number(re.getAttribute('data-reply-idx')); state.editReply = { id: u2.id, text: ix === -1 ? '' : (ix === 1 ? (u2.suggestion2 || '') : (u2.suggestion1 || '')) }; render(); }
    return;
  }
  if (e.target.closest('[data-reply-cancel]')) { state.editReply = null; render(); return; }
  var rse = e.target.closest('[data-reply-send-edited]');
  if (rse) {
    var u3 = state.unreplied.find(function(x){ return x.id === rse.getAttribute('data-reply-send-edited'); });
    var ta = document.getElementById('reply-edit-text');
    if (u3 && ta) sendReply(u3, ta.value);

  }
  var rq = e.target.closest('[data-req-mock]');

    var rr = (window.__ranked || [])[Number(rq.getAttribute('data-req-mock'))];
    if (rr) {
      var ttl = slackTitle(rr.g.rep.text);
      state.mockRequests.push({ id: 'local-' + Date.now(), request_title: ttl, status: 'pending' });

      fetch('/api/mock-requests', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ request_title: ttl }) }).catch(function(){});
      // プロトタイプ用シミュレーション: サンプルの生成モックが数秒後に届く
      setTimeout(function(){
        var sm = (PRE && PRE.mocks || []).find(function(x){ return ttl.includes(String(x.request_title).slice(0, 12)) || String(x.request_title).includes(ttl.slice(0, 12)); });
        if (sm && !state.mocks.find(function(x){ return x.id === sm.id; })) {
          state.mocks.push(sm);
          state.mockRequests = state.mockRequests.filter(function(x){ return !(x.status === 'pending' && x.request_title === ttl); });
          if (state.tab === 'slack') render();
        }
      }, 3500);
    }
    return;
  }
  var gm = e.target.closest('[data-genmock]');
  if (gm) {
    var found = state.mocks.find(function(x){ return x.id === gm.getAttribute('data-genmock'); });
    if (found) { state.mockView = { kind: 'gen', title: found.request_title, html: found.html, requirements: found.requirements || '' }; render(); }
    return;
  }
  if (e.target.closest('[data-dl-req]')) {
    if (state.mockView && state.mockView.requirements) downloadFile('requirements.md', state.mockView.requirements, 'text/markdown');
    return;
  }
  if (e.target.closest('[data-dl-gen]')) {
    if (state.mockView && state.mockView.html) downloadFile('mock-generated.html', state.mockView.html, 'text/html');
    return;
  }
  var mk = e.target.closest('[data-mock]');
  if (mk) {
    var r = (window.__ranked || [])[Number(mk.getAttribute('data-mock'))];
    if (r) { state.mockView = { title: slackTitle(r.g.rep.text), text: r.g.rep.text }; render(); }
    return;
  }
  if (e.target.closest('[data-mock-back]')) { state.mockView = null; render(); return; }
  if (e.target.closest('[data-dl-mock]')) {
    var mv2 = state.mockView;
    if (mv2) {
      var pat2 = state.mockPat || mockPatternFor(mv2.title + ' ' + mv2.text);
      var doc = '<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc(mv2.title) + '</title><style>' + WF_CSS + '</style></head><body><h1>' + esc(mv2.title) + '（' + esc(pat2.label) + ' / テンプレ式モック）</h1>' + mockFrameHtml(mv2.title, mockBodyFor(pat2, mv2)) + '</body></html>';
      downloadFile('mock.html', doc, 'text/html');

  var dp = e.target.closest('[data-dl-pack]');
  if (dp) {
    var pt = (window.__packs || [])[Number(dp.getAttribute('data-dl-pack'))];
    if (pt) downloadFile('request-pack.txt', pt, 'text/plain');
    return;
  }
  var pk = e.target.closest('[data-pack]');
  if (pk) {
    var packText = (window.__packs || [])[Number(pk.getAttribute('data-pack'))];
    if (packText && navigator.clipboard) navigator.clipboard.writeText(packText).then(function(){ pk.textContent = 'コピーしました'; setTimeout(function(){ pk.textContent = '素材パックをコピー'; }, 1600); });
    return;
  }
  var co = e.target.closest('[data-company]');
  if (co) { state.companySel = co.getAttribute('data-company'); render(); return; }
  if (e.target.closest('[data-back-companies]')) { state.companySel = null; render(); return; }
});
